name: Build Citra 0.1 Native Windows x64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Verify toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Compile smoke test
        run: cargo check --workspace --all-targets

      - name: Unit tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --release --workspace

      - name: Package
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts\Citra-0.1-Native-win-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Copy-Item ".\target\release\Citra.exe" $out
          Copy-Item ".\target\release\citra-image-decoder.exe" $out
          Copy-Item ".\README.md" $out
          Copy-Item ".\docs\ARCHITECTURE.md" $out
          Copy-Item ".\docs\MACHINE_PROTOCOL_V1.md" $out

          $files = Get-ChildItem $out -File
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii (Join-Path $out "SHA256SUMS.txt")

          Write-Host "Package contents:"
          Get-ChildItem $out | Select-Object Name, Length
          $total = (Get-ChildItem $out -File | Measure-Object Length -Sum).Sum
          Write-Host ("Total package size: {0:N2} MB" -f ($total / 1MB))

      - name: Upload Citra artifact
        uses: actions/upload-artifact@v7
        with:
          name: Citra-0.1-Native-win-x64
          path: artifacts/Citra-0.1-Native-win-x64/
          retention-days: 7
          if-no-files-found: error
