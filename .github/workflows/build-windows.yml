name: Build MiniBrowser Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-windows-x64:
    name: Windows x64 portable build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Show SDK information
        shell: pwsh
        run: dotnet --info

      - name: Restore NuGet packages
        shell: pwsh
        run: dotnet restore .\MiniBrowser.sln -p:RuntimeIdentifier=win-x64

      - name: Publish self-contained Windows x64 build
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "artifacts\MiniBrowser-win-x64"
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          dotnet publish .\src\MiniBrowser.App\MiniBrowser.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -o $output `
            -p:Platform=x64 `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Validate packaged browser
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "artifacts\MiniBrowser-win-x64"
          $exe = Join-Path $output "MiniBrowser.exe"
          $cef = Join-Path $output "libcef.dll"

          if (-not (Test-Path $exe)) {
            throw "MiniBrowser.exe was not produced."
          }

          if (-not (Test-Path $cef)) {
            throw "libcef.dll was not produced; CefSharp runtime is incomplete."
          }

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MiniBrowser.exe" | Set-Content -Encoding ascii (Join-Path $output "SHA256SUMS.txt")

          Write-Host "MiniBrowser.exe: $((Get-Item $exe).Length) bytes"
          Write-Host "SHA-256: $hash"
          Write-Host "Package size: $([math]::Round(((Get-ChildItem $output -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 2)) MB"

      - name: Upload ready-to-run browser
        uses: actions/upload-artifact@v7
        with:
          name: MiniBrowser-win-x64
          path: artifacts/MiniBrowser-win-x64/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
