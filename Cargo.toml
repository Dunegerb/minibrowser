[workspace]
members = [
    "crates/citra-protocol",
    "crates/citra-machine",
    "crates/citra-network",
    "crates/citra-renderer",
    "crates/citra-capsules",
    "crates/citra-image-decoder",
    "crates/citra-core",
    "crates/citra-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
base64 = "0.23.1"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
html5ever = "0.39.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "http2", "gzip", "brotli", "deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
url = "2.5.8"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
